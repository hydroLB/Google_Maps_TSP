name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.detect.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect tag
        id: detect
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "This run is not attached to a tag; release publication is disabled."
            echo "release_tag=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tag="${GITHUB_REF_NAME:-}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z. Got: ${tag}" >&2
            exit 1
          fi
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Validate tag matches project version
        if: steps.detect.outputs.release_tag != ''
        run: |
          set -euo pipefail
          tag="${{ steps.detect.outputs.release_tag }}"
          version="${tag#v}"
          if [[ "$(git cat-file -t "${tag}")" != "tag" ]]; then
            echo "Release tags must be annotated. Got lightweight tag: ${tag}" >&2
            exit 1
          fi
          if ! git rev-parse --verify origin/main >/dev/null; then
            echo "Full checkout did not contain origin/main; release validation cannot continue." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${tag}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Release tag ${tag} must point to a commit on main." >&2
            exit 1
          fi
          project_version="$(python3 - <<'PY'
          from __future__ import annotations
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              project = tomllib.load(handle).get("project", {})
          version = project.get("version")
          if not isinstance(version, str) or not version:
              raise SystemExit("Unable to find project.version in pyproject.toml")
          print(version)
          PY
          )"
          if [[ "${version}" != "${project_version}" ]]; then
            echo "Tag ${tag} does not match pyproject version ${project_version}" >&2
            exit 1
          fi

  secret_scan:
    runs-on: ubuntu-latest
    needs: validate_tag
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.1
      - name: Full-history secret scan
        run: gitleaks detect --source . --config gitleaks.toml --redact --no-banner

  build_artifacts:
    runs-on: ubuntu-latest
    needs: [validate_tag, secret_scan]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
      - name: Run release quality gate
        run: |
          set -euo pipefail
          ./scripts/check.sh
      - name: Verify tracked files remain unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
      - name: Generate artifact checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
      - name: Upload dist artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-dist-${{ github.run_id }}
          path: dist/**
          if-no-files-found: error

  publish_release:
    runs-on: ubuntu-latest
    needs: [validate_tag, build_artifacts]
    if: needs.validate_tag.outputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist-${{ github.run_id }}
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ needs.validate_tag.outputs.release_tag }}
          name: ${{ needs.validate_tag.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/**
