name: Bug report
description: Report a reproducible defect.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Provide enough detail to reproduce the issue in a clean checkout.
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: One-line description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include exact commands, inputs, and expected versus actual behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste relevant logs, traceback, or screenshots.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS/Linux, Python version, branch/commit.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain user or developer impact.
